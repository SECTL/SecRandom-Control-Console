# SecRandom 集控 · 反向代理（TLS 终止 + WebSocket + SSE）
#
# 用法：把域名与证书路径换成你自己的，放进 /etc/nginx/conf.d/ 或 sites-available。
#
#   把 control.example.com 换成你的域名；
#   把证书路径换成你的（下面按 certbot 的默认布局写）。
#
# 这个文件里有三条"少一条就出怪毛病"的规则，都是踩过的：
#
#   1. /api/ 和 /v1/ 都必须代理。只代理 /v1/ 的话，/api/auth/* 会落到 SPA 回退
#      返回 index.html —— 浏览器拿到一坨 HTML，表现为"点登录按钮没反应"。
#   2. WebSocket（节点通道）与 SSE（控制台事件流）都要单独放行并关掉缓冲，
#      否则代理默认 60 秒就掐连接、事件流会被攒着不发。
#   3. index.html 不缓存、/assets/ 长缓存（文件名带内容哈希）。反了的话，
#      发版后老页面继续请求已经不存在的资源，用户得按 Ctrl+F5 才能用。

upstream secrandom_control {
    # 与 docker-compose.yml 的端口绑定对应：容器只把 8791 开在回环上。
    # 裸机部署时这里就是服务端自己监听的地址（CTRL_LISTEN_URL）。
    server 127.0.0.1:8791;

    # 与上游保持长连接，省掉每次请求重新握手。配合下面的 Connection ""。
    keepalive 32;
}

# ── 80：只做跳转与 ACME 挑战 ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name control.example.com;

    # 证书自动续期的验证路径留在明文侧，别跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443：真正的入口 ──────────────────────────────────────────────────────────
server {
    # nginx >= 1.25.1 用 `http2 on;`；更老的版本改成 `listen 443 ssl http2;`。
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name control.example.com;

    ssl_certificate     /etc/letsencrypt/live/control.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 控制台会带上策略包与名单；默认 1m 对"几百台设备的名单"偏小。
    client_max_body_size 32m;

    # 上游是明文 HTTP，且只走回环 —— TLS 在这一层终止。
    # 不要让这个端口直接暴露公网（见 README 的"不要这样做"）。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── 登录 / 回调 / 会话 / 登出 ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://secrandom_control;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ── 节点通道：WebSocket 长连接 ──────────────────────────────────────────
    # 前缀比 /v1/ 长，nginx 会优先匹配这里。
    location /v1/node/connect {
        proxy_pass http://secrandom_control;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 心跳是 25 秒一次；这两项要明显大于心跳间隔，否则会被误判断线。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── 其余协议接口，含控制台的 SSE 事件流 ─────────────────────────────────
    location /v1/ {
        proxy_pass http://secrandom_control;
        proxy_set_header Connection "";

        # SSE：不缓冲、不压缩、不攒包，并且把超时放宽。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 前端静态资源 ────────────────────────────────────────────────────────
    # Vite 产物文件名带内容哈希，可以放心长缓存。
    location /assets/ {
        proxy_pass http://secrandom_control;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 其余全部交给服务端（含 SPA 回退）────────────────────────────────────
    location / {
        proxy_pass http://secrandom_control;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # 入口 HTML 一律不缓存：它引用的是带哈希的资源名，缓存住就等于发版不生效。
    location = /index.html {
        proxy_pass http://secrandom_control;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /version.json {
        proxy_pass http://secrandom_control;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
